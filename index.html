<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klondike Solitaire</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <header>
            <h1>Solitaire</h1>
            <div class="controls">
                <div class="settings">
                    <label for="draw-count">Draw:</label>
                    <select id="draw-count">
                        <option value="1">1</option>
                        <option value="3" selected>3</option>
                    </select>
                </div>
                <div class="stats-box">Time: <span id="timer">00:00</span></div>
                <div class="stats-box">Score: <span id="score">0</span></div>
                <div class="stats-box">Moves: <span id="move-count">0</span></div>
                <button id="new-game-btn">New Game</button>
                <button id="auto-complete-btn" class="hidden">Auto-Finish</button>
            </div>
        </header>

        <div id="board">
            <div id="top-row">
                <div id="stock-container">
                    <div id="stock" class="pile stock-pile"></div>
                    <div id="waste" class="pile waste-pile"></div>
                </div>
                <!-- Spacer for aesthetic alignment -->
                <div class="spacer"></div>
                <div id="foundations-container">
                    <div id="foundation-0" class="pile foundation-pile" data-suit="hearts"></div>
                    <div id="foundation-1" class="pile foundation-pile" data-suit="diamonds"></div>
                    <div id="foundation-2" class="pile foundation-pile" data-suit="clubs"></div>
                    <div id="foundation-3" class="pile foundation-pile" data-suit="spades"></div>
                </div>
            </div>

            <div id="tableau-container">
                <div id="tableau-0" class="tableau-pile"></div>
                <div id="tableau-1" class="tableau-pile"></div>
                <div id="tableau-2" class="tableau-pile"></div>
                <div id="tableau-3" class="tableau-pile"></div>
                <div id="tableau-4" class="tableau-pile"></div>
                <div id="tableau-5" class="tableau-pile"></div>
                <div id="tableau-6" class="tableau-pile"></div>
            </div>
        </div>
    </div>
    
    <!-- Modals -->
    <div id="modal-overlay" class="hidden">
        <div class="modal">
            <h2 id="modal-title">Game Over</h2>
            <p id="modal-message">No more valid moves available.</p>
            <div class="modal-stats" id="modal-stats"></div>
            <button id="modal-btn">Try Again</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
